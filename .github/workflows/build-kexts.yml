# Compile check on GitHub's macOS runners: builds the kexts with Xcode's macOS SDK and checks they link against the kernel libraries
# they declare. It cannot load or run them (that needs the console).
name: Build kexts (compile check)

on:
  push:
    branches: [ci-build-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and SDK
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcrun --show-sdk-version

      - name: Build PS5Power
        run: KEXT=PS5Power tools/build_kext.sh

      - name: Inspect PS5Power
        run: |
          K=build/kexts/PS5Power.kext
          plutil -lint "$K/Contents/Info.plist"
          file "$K/Contents/MacOS/PS5Power"
          echo "--- class symbols"
          nm "$K/Contents/MacOS/PS5Power" | grep -E "8PS5Power|_kmod_info" | head -40
          echo "--- undefined symbols (must all come from the kernel)"
          nm -u "$K/Contents/MacOS/PS5Power"

      - name: Resolve PS5Power's symbols against its OSBundleLibraries
        continue-on-error: true
        run: |
          K=build/kexts/PS5Power.kext
          kmutil libraries -p "$K" --undef-symbols 2>&1 || kextlibs -undef-symbols "$K" 2>&1

      - name: Build PS5SalinaGbE and PS5GpuProbe (reference: the existing kexts)
        continue-on-error: true
        run: |
          tools/build_kext.sh
          KEXT=PS5GpuProbe tools/build_kext.sh

      - name: PS5Power against the simulated ICC mailbox (Apple clang)
        run: |
          clang++ -std=c++17 -Wall -Wextra -Wno-unused-parameter -I tools/ci/kstub -o /tmp/ps5power_test tools/ci/test_ps5power.cpp
          /tmp/ps5power_test

      - uses: actions/upload-artifact@v4
        with:
          name: kexts
          path: build/kexts/*.kext
